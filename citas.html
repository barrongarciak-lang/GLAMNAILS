<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agenda tu cita - Glam Nails</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>

body{
font-family: Arial;
background:#fde6f2;
text-align:center;
padding:30px;
}

#calendar{
max-width:600px;
margin:40px auto;
background:white;
padding:20px;
border-radius:10px;
}

.formulario{
background:white;
width:350px;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input, select{
width:100%;
padding:10px;
margin:10px 0;
}

button{
background:#ff4da6;
color:white;
border:none;
padding:12px;
width:100%;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#e60073;
}

</style>

</head>

<body>

<h1>Agenda tu cita </h1>

<div id="calendar"></div>

<div class="formulario">

<input type="text" id="nombre" placeholder="Tu nombre">

<input type="tel" id="telefono" placeholder="Tu teléfono">

<label>Hora disponible</label>

<select id="hora">
<option>10:00 AM</option>
<option>11:00 AM</option>
<option>12:00 PM</option>
<option>1:00 PM</option>
<option>2:00 PM</option>
<option>3:00 PM</option>
<option>4:00 PM</option>
</select>

<button onclick="reservar()">Reservar cita</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>

let fechaSeleccionada=""

document.addEventListener('DOMContentLoaded', function() {

let calendarEl = document.getElementById('calendar')

let calendar = new FullCalendar.Calendar(calendarEl, {

initialView: 'dayGridMonth',

dateClick: function(info) {

fechaSeleccionada = info.dateStr

alert("Seleccionaste el día: " + fechaSeleccionada)

}

})

calendar.render()

})

function reservar(){

let nombre = document.getElementById("nombre").value
let telefono = document.getElementById("telefono").value
let hora = document.getElementById("hora").value

if(nombre=="" || telefono=="" || fechaSeleccionada==""){

alert("Selecciona fecha y llena los datos")

return

}

alert("Ahora debes pagar el anticipo para confirmar tu cita")

window.open("AQUI_VA_TU_LINK_DE_PAGO")

}

</script>

</body>
</html>
